# Mine a private BLAKE2b test chain with a Sia-compatible ASIC, on plain Docker.
#
# Same images as the StartOS and Umbrel packages, wired the way the Umbrel app
# wires them: the gateway takes its payout address from the node by itself, and
# the page on port 7153 shows the address to point a miner at.
#
#   HOST_IP=$(ip -4 route get 1.1.1.1 | grep -oP 'src \K\S+') docker compose up -d
#
# Chain and payout address are set on the page this serves, not here. They live in
# a shared `config` volume that the node and gateway both read and watch: changing
# them stops those two, and `restart: unless-stopped` brings them back on the new
# settings. Nothing in here holds a Docker socket to do that.
#
# HOST_IP is the address a miner is told to connect to. It has to be passed in:
# a container can only see its own address on the Docker network, and most ASIC
# firmware cannot resolve a .local name, so guessing it wrong fails silently.
#
# Every published port can be moved if something already has it, which on a
# general-purpose machine is likely enough to be worth allowing for. Nothing
# assigns ports for you here the way StartOS and Umbrel do, and a clash is a
# failed start rather than a warning:
#
#   PAGE_PORT=8153 DASHBOARD_PORT=8152 docker compose up -d
#
# Only the left-hand side moves. The ports inside the containers are fixed, and
# the page reads the published ones from these same variables, so a miner is
# always told the right number.

name: blake2b-mining

services:
  # Bitcoin Knots built from the BLAKE2b proof-of-work branch, on its own private
  # regtest chain. No ports: RPC and P2P stay on the internal network. RPC
  # authenticates with the cookie the node writes itself.
  node:
    image: paulscode/knots-blake2b:1.0.3
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      CHAIN: regtest
      # Consensus-critical. The activation block's coinbase must contain this
      # string, and the gateway below must be given the same one.
      BLAKE2B_HEADLINE: "BLAKE2b lab 2026-08-21"
      # 1 means the first block mined is already BLAKE2b. A Sia ASIC cannot mine
      # SHA256d at all, so anything higher leaves the miner connected and idle.
      BLAKE2B_ACTIVATION_HEIGHT: "1"
      # Docker's default bridge range. Change this if your Docker networks use
      # something else, or the node will refuse the gateway's RPC calls.
      RPC_ALLOW_IP: "172.16.0.0/12"
      PRUNE: "550"
    volumes:
      - node-data:/data
      - config:/config:ro

  # The gateway: turns the node's block templates into Stratum work a Sia-style
  # BLAKE2b ASIC can mine.
  gateway:
    image: paulscode/datum-blake2b:1.0.6
    restart: unless-stopped
    depends_on: [node]
    stop_grace_period: 30s
    environment:
      RPC_URL: http://node:18443
      # The node's own cookie, read off its data directory. No RPC password is
      # generated, stored or shared by either side.
      COOKIE_PATH: /node/regtest/.cookie
      BLAKE2B_HEADLINE: "BLAKE2b lab 2026-08-21"
      # Ask the node for a payout address on first start and keep it. Legacy,
      # because the gateway's address parser rejects bcrt1 addresses.
      AUTO_PAYOUT_FROM_NODE: "1"
      STRATUM_PORT: "23336"
      API_PORT: "7152"
    volumes:
      - gateway-data:/data
      - node-data:/node:ro
      # Chain and payout address, read and watched. A change here stops the
      # gateway so the restart policy brings it back on the new settings.
      - config:/config:ro
    ports:
      - "${STRATUM_PORT:-23336}:23336"       # Stratum, for the miner
      - "${DASHBOARD_PORT:-7152}:7152"       # the gateway's own mining dashboard

  # The opt-in compatibility-test port. A miner pointed here mines exactly as
  # normal, with its conversation recorded so it can be turned into a report.
  capture:
    image: paulscode/datum-blake2b:1.0.6
    restart: unless-stopped
    depends_on: [gateway]
    entrypoint: ["python3", "/usr/local/bin/stratumtap.py"]
    command:
      ["--listen", "0.0.0.0:23337",
       "--upstream", "gateway:23336",
       "--log", "/data/capture/wire.jsonl"]
    volumes:
      - gateway-data:/data
    ports:
      - "${CAPTURE_PORT:-23337}:23337"

  # The page to open: the Stratum address, a link to the dashboard, and the
  # compatibility-report form.
  report:
    image: paulscode/datum-blake2b:1.0.6
    restart: unless-stopped
    depends_on: [gateway]
    entrypoint: ["python3", "/usr/local/bin/report_server.py"]
    command:
      ["--listen", "0.0.0.0:7154",
       "--capture-log", "/data/capture/wire.jsonl",
       "--stratum-port", "${STRATUM_PORT:-23336}",
       "--capture-port", "${CAPTURE_PORT:-23337}",
       "--dashboard-port", "${DASHBOARD_PORT:-7152}",
       "--host-ip", "${HOST_IP:-}"]
    environment:
      # Only the node can say whether a block was accepted, and an accepted share
      # is not a block. Read-only, and the only call made is getblockheader.
      RPC_URL: http://node:18443
      COOKIE_PATH: /node/regtest/.cookie
    volumes:
      - gateway-data:/data
      # The only writer. The page saves here; node and gateway watch it.
      - config:/config
      - node-data:/node:ro
    ports:
      - "${PAGE_PORT:-7153}:7154"

volumes:
  node-data:
  gateway-data:
  # Chain and payout address, written by the page, read by the node and gateway.
  config:
