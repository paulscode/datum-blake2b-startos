# Mine the BLAKE2b chain with a Sia-compatible ASIC, on plain Docker.
#
# Same images as the StartOS and Umbrel packages. The gateway takes its payout
# address from the node by itself, so there is nothing to configure before
# starting:
#
#   docker compose up -d
#
# THIS MINES A REAL CHAIN. Bitcoin's mainnet split on 30 August 2026, and from
# block 961640 one of the two chains uses BLAKE2b for proof of work. A block you
# find pays its whole subsidy to an address in the node's own wallet, so back
# that wallet up. `docker compose down -v` would delete it along with everything
# else; `down` without `-v` keeps the volumes.
#
# The node is pruned to 5 GB by default, which is enough to mine: a gateway needs
# the tip, not history. Raise PRUNE, or set it to 0 for the whole chain.
#
# The published ports can be moved if something already has them, which on a
# general-purpose machine is likely enough to be worth allowing for. Nothing
# assigns ports for you here the way StartOS and Umbrel do, and a clash is a
# failed start rather than a warning:
#
#   STRATUM_PORT=8336 DASHBOARD_PORT=8152 docker compose up -d
#
# Only the left-hand side moves. The ports inside the containers are fixed.
#
# `start.sh` in this directory does the same thing while picking ports that are
# actually free, and prints the address to give a miner.

name: blake2b-mining

services:
  # Bitcoin Knots built from the BLAKE2b proof-of-work change, following the
  # BLAKE2b chain on mainnet. No published ports: RPC stays on the internal
  # network and authenticates with the cookie the node writes itself.
  #
  # 8333 is not published either, so this node makes outbound connections and
  # accepts no inbound ones. That is enough to sync and to mine. Publish it if
  # you want to serve peers.
  node:
    image: paulscode/knots-blake2b:1.0.9
    restart: unless-stopped
    # Long, and it matters. bitcoind flushes its chainstate on shutdown, and a
    # stop that does not wait for it throws away everything since the last
    # flush. Measured during an initial sync: stopping at height 84900 came back
    # at 327.
    stop_grace_period: 5m
    environment:
      # Docker's default bridge range. Change this if your Docker networks use
      # something else, or the node will refuse the gateway's RPC calls.
      RPC_ALLOW_IP: "172.16.0.0/12"
      PRUNE: "5000"
    volumes:
      - node-data:/data

  # The gateway: turns the node's block templates into Stratum work a Sia-style
  # BLAKE2b ASIC can mine.
  gateway:
    image: paulscode/datum-blake2b:1.0.12
    restart: unless-stopped
    depends_on: [node]
    stop_grace_period: 30s
    environment:
      RPC_URL: http://node:18443
      # The node's own cookie, read off its data directory. No RPC password is
      # generated, stored or shared by either side. Mainnet keeps it at the root
      # of the data directory.
      COOKIE_PATH: /node/.cookie
      # Ask the node for a payout address on first start and keep it. It is your
      # node and your wallet, so this saves a step rather than inventing an
      # address. Set POOL_ADDRESS instead to pay somewhere you already back up.
      AUTO_PAYOUT_FROM_NODE: "1"
      STRATUM_PORT: "23336"
      API_PORT: "7152"
    volumes:
      - gateway-data:/data
      - node-data:/node:ro
    ports:
      # Stratum, for the miner. Point your ASIC at this machine's IP address on
      # this port; most ASIC firmware cannot resolve a .local name.
      - "${STRATUM_PORT:-23336}:23336"
      # The gateway's own dashboard. Nothing in front of it, so treat it as
      # visible to anything on your network. The admin pages are off unless you
      # set ADMIN_PASSWORD above.
      - "${DASHBOARD_PORT:-7152}:7152"

volumes:
  node-data:
  gateway-data:
